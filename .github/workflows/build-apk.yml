name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o roblox_ai_search_mvp.zip
          ls -la
          ls -la roblox_ai_search

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: roblox_ai_search
        run: flutter create --platforms=android .

      - name: Fix Dart code
        working-directory: roblox_ai_search
        run: |
          sed -i 's/saved.map((g)=>ListTile(/saved.map<Widget>((g)=>ListTile(/' lib/main.dart
          sed -i 's/)).toList()));/))).toList()));/' lib/main.dart

      - name: Install dependencies
        working-directory: roblox_ai_search
        run: flutter pub get

      - name: Build APK
        working-directory: roblox_ai_search
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roblox-ai-search-apk
          path: roblox_ai_search/build/app/outputs/flutter-apk/app-release.apk
